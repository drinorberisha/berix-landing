<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <!-- Dark Background -->
    <rect width="100" height="100" fill="#000810"/>
    
    <!-- Circuits -->
    <g stroke="#00f3ff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8">
        <!-- We use standard SVG paths to simulate the circuitry look -->
        <!-- Top Left -->
        <polyline points="20,20 30,30 30,40" />
        <circle cx="20" cy="20" r="1.5" fill="#00f3ff" stroke="none" />
        <polyline points="30,15 35,25 35,40" />
        <circle cx="30" cy="15" r="1.5" fill="#00f3ff" stroke="none" />
        <polyline points="15,35 25,35 30,45" />
        <circle cx="15" cy="35" r="1.5" fill="#00f3ff" stroke="none" />
        <polyline points="40,10 40,30 43,40" />
        <circle cx="40" cy="10" r="1.5" fill="#00f3ff" stroke="none" />

        <!-- Top Right -->
        <polyline points="80,20 70,30 70,40" />
        <circle cx="80" cy="20" r="1.5" fill="#00f3ff" stroke="none" />
        <polyline points="70,15 65,25 65,40" />
        <circle cx="70" cy="15" r="1.5" fill="#00f3ff" stroke="none" />
        <polyline points="85,35 75,35 70,45" />
        <circle cx="85" cy="35" r="1.5" fill="#00f3ff" stroke="none" />
        <polyline points="60,10 60,30 57,40" />
        <circle cx="60" cy="10" r="1.5" fill="#00f3ff" stroke="none" />

        <!-- Bottom Left -->
        <polyline points="20,80 30,70 30,60" />
        <circle cx="20" cy="80" r="1.5" fill="#00f3ff" stroke="none" />
        <polyline points="30,85 35,75 35,60" />
        <circle cx="30" cy="85" r="1.5" fill="#00f3ff" stroke="none" />
        <polyline points="15,65 25,65 30,55" />
        <circle cx="15" cy="65" r="1.5" fill="#00f3ff" stroke="none" />
        <polyline points="40,90 40,70 43,60" />
        <circle cx="40" cy="90" r="1.5" fill="#00f3ff" stroke="none" />

        <!-- Bottom Right -->
        <polyline points="80,80 70,70 70,60" />
        <circle cx="80" cy="80" r="1.5" fill="#00f3ff" stroke="none" />
        <polyline points="70,85 65,75 65,60" />
        <circle cx="70" cy="85" r="1.5" fill="#00f3ff" stroke="none" />
        <polyline points="85,65 75,65 70,55" />
        <circle cx="85" cy="65" r="1.5" fill="#00f3ff" stroke="none" />
        <polyline points="60,90 60,70 57,60" />
        <circle cx="60" cy="90" r="1.5" fill="#00f3ff" stroke="none" />
    </g>

    <!-- BERIX Text with stylised 'X' (similar to logo) -->
    <g fill="#ffffff" transform="translate(14, 56) scale(0.6)">
        <!-- B -->
        <path d="M 0 0 V -28 h 9 c 4.5 0, 7.5 2, 7.5 6 c 0 3, -2 4.5, -4.5 5.5 c 3.5 1, 5.5 3, 5.5 6.5 c 0 4.5, -3.5 10, -9 10 H 0 Z M 3.5 -4 h 5.5 c 2.5 0, 4.5 -1.5, 4.5 -4.5 c 0 -2.5, -1.5 -4.5, -4.5 -4.5 H 3.5 V -4 Z M 3.5 -16.5 h 4.5 c 2.5 0, 4 -1.5, 4 -3.5 c 0 -2.5, -1.5 -3.5, -4 -3.5 H 3.5 V -16.5 Z" />
        <!-- E -->
        <path d="M 22 0 V -28 h 13 v 3.5 H 25.5 v 7 h 8 v 3.5 h -8 v 10.5 h 9.5 v 3.5 H 22 Z" />
        <!-- R -->
        <path d="M 43 0 V -28 h 9.5 c 5.5 0, 9 2.5, 9 8.5 c 0 4, -2 6.5, -5.5 7.5 l 6.5 12 H 58.5 l -5.5 -11 h -4.5 v 11 H 43 Z M 46.5 -15 h 4.5 c 2.5 0, 5.5 -1, 5.5 -4.5 c 0 -3.5, -2.5 -5, -5.5 -5 h -4.5 V -15 Z" />
        <!-- Stylized > (Cyan color) -->
        <path d="M 68 -26 L 81 -14 L 68 -2 l 2.5 2.5 l 14.5 -14.5 l -14.5 -14.5 Z" fill="#00f3ff" />
        <!-- X rest -->
        <path d="M 88 -28 L 93 -28 L 102 -15 L 111 -28 L 116 -28 L 105 -12 L 118 0 L 112 0 L 102 -10 L 92 0 L 86 0 L 99 -12 Z" />
    </g>
</svg>
